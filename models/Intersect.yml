unique_name: Intersect
object_type: model
label: Intersect
metrics:
  - unique_name: Customer Count
relationships:
  - unique_name: factinternetsales_orderdatekey_to_Period 1_Date P1
    from:
      dataset: factinternetsales
      join_columns:
        - orderdatekey
    to:
      dimension: Period 1
      level: Date P1
  - unique_name: factinternetsales_orderdatekey_to_Period 2_Date P2
    from:
      dataset: factinternetsales
      join_columns:
        - orderdatekey
    to:
      dimension: Period 2
      level: Date P2
  - unique_name: factinternetsales_currencykey_to_Customer_Customer Level
    from:
      dataset: factinternetsales
      join_columns:
        - currencykey
    to:
      dimension: Customer
      level: Customer Level
  - unique_name: factinternetsales_salesordernumber_to_Order Dimension_order_line_item
    from:
      dataset: factinternetsales
      join_columns:
        - salesorderlinenumber
        - salesordernumber
        - currencykey
    to:
      dimension: Order Dimension
      level: order_line_item
